name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run only for pushes to main in this repo. Pull requests from forks —
# which is how changes arrive here — never see the Cloudflare token, because
# fork PRs cannot read repository secrets and this workflow does not run on
# pull_request at all.
permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Migrations first: a deploy that ships code expecting a column the
      # database does not have yet is the one failure mode that takes the board
      # down rather than just leaving it stale.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply gh-inbox --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
