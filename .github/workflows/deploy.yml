name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run only for pushes to main in this repo. Pull requests from forks —
# which is how changes arrive here — never see the Cloudflare token, because
# fork PRs cannot read repository secrets and this workflow does not run on
# pull_request at all.
permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN lives in the `production` environment rather than as
    # a plain repository secret, so the job has to declare the environment to
    # see it at all. Without this line `secrets.CLOUDFLARE_API_TOKEN` resolves
    # to an empty string and wrangler-action fails on an unauthenticated call
    # rather than on a missing secret.
    environment: production
    steps:
      # Every action in this job is pinned to a commit, not a tag. The job
      # holds CLOUDFLARE_API_TOKEN, so a retargeted or compromised mutable tag
      # would run attacker-controlled code beside the secret. Tags are
      # comments here; the SHA is the contract.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Migrations first: a deploy that ships code expecting a column the
      # database does not have yet is the one failure mode that takes the board
      # down rather than just leaving it stale.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply triaghe --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
