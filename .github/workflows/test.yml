name: test

# Runs on pull requests, unlike deploy.yml. These tests need no secrets — they
# drive the real handlers against in-memory SQLite with a stubbed fetch — so
# they are safe to run for fork PRs, which is how every change arrives here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits for the same reason deploy.yml is, even though this
      # job holds no secrets: a retargeted tag here would run different code and
      # report a passing test suite for it, which is the check every other
      # protection is downstream of.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
