name = "triaghe"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The Access hostname is the only way in.
#
# Both of these default to *enabled* when absent, which is how the first deploy
# published the board on `triaghe.<subdomain>.workers.dev` — a hostname the
# Access application does not sit in front of. It failed closed (401, no Access
# identity), so nothing leaked, but the whole security model is "Access
# terminates in front of this", and a route that bypasses Access is one config
# regression away from mattering. Preview URLs are the same hole per deployment.
workers_dev = false
preview_urls = false

# inbox.jdx.dev is managed in the Cloudflare dashboard. Omit route/routes here
# so deployments do not require zone-level route permissions.

# Static board. run_worker_first so every response — asset or API — goes through
# the Worker and picks up the same CSP and cache headers. At this traffic level
# the extra invocation costs nothing and having one place that sets security
# headers is worth more than saving it.
assets = { directory = "./web", binding = "ASSETS", run_worker_first = true }

[[d1_databases]]
binding = "DB"
database_name = "triaghe"
database_id = "11bc1f6c-f7e5-4e81-a221-99e6ff3dd616"
migrations_dir = "migrations"

[triggers]
# Incremental poll. Each run also advances the backfill by one window, so a
# cold database fills in over a few hours without any single run doing
# unbounded work.
crons = ["*/15 * * * *"]

[vars]
TRIAGHE_OWNER = "jdx"
TRIAGHE_SCOPE = "user:jdx"
# Cloudflare Access. TEAM_DOMAIN is <team>.cloudflareaccess.com; ACCESS_AUD is
# the Application Audience tag of the Access app in front of this Worker.
# Both are public identifiers, not secrets.
ACCESS_TEAM_DOMAIN = "noisy-shadow-bb87.cloudflareaccess.com"
ACCESS_AUD = "d267e3c667b289cf100d032a9982883f718ef8fb25bbedf4a74b422d751cd882"

# Secrets (set with `wrangler secret put`, never in this file):
#   GITHUB_APP_ID
#   GITHUB_APP_INSTALLATION_ID
#   GITHUB_APP_PRIVATE_KEY
#   OWNER_EMAIL   the single identity allowed to approve a post to GitHub.
#                 A secret rather than a var purely to keep a personal address
#                 out of a public repository; it is not a credential, and
#                 nothing about the security model depends on it being hidden.
[observability]
enabled = true
